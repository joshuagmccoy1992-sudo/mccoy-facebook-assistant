name: Free Lead Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python lead_watch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lead-results
          path: results.csv
